<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAB8-peli</title>

<script data-goatcounter="https://e-nurmi.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    max-width:900px;
    margin:auto;
    padding:20px;
    text-align:center;
}

#top{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin-bottom:10px;
}

#top div{
    margin:5px;
    font-size:1.1rem;
}

#combo{
    color:orange;
    font-weight:bold;
    margin:10px;
    font-size:1.3rem;
}

.big{
    font-size:2rem;
    margin:12px;
}

button{
    width:44%;
    padding:14px;
    margin:6px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.08);
}

svg{
    background:#1a1a1a;
    border-radius:8px;
}

#question{
    min-height:260px;
}
</style>
</head>

<body>

<h1>MAB8-peli</h1>

<div id="top">
    <div>Pisteet: <span id="score">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>Paras: <span id="best">0</span></div>
    <div>Aika: <span id="time">60</span></div>
</div>

<div id="combo">🔥 x1</div>

<div id="question"></div>
<div id="answers"></div>
<div id="message"></div>

<script>

let score = 0;
let lives = 3;
let combo = 1;
let timeLeft = 60;
let currentTask = null;

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const bestEl = document.getElementById("best");
const timeEl = document.getElementById("time");
const comboEl = document.getElementById("combo");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const messageEl = document.getElementById("message");

let bestScore =
    Number(localStorage.getItem("mab8best")) || 0;

bestEl.textContent = bestScore;

function rnd(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function shuffle(arr){

    let a=[...arr];

    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}

function updateHUD(){

    scoreEl.textContent = score;
    livesEl.textContent = lives;
    bestEl.textContent = bestScore;
    comboEl.textContent = "🔥 x"+combo;

}

function showTask(task){

    currentTask = task;

    questionEl.innerHTML = task.question;
    answersEl.innerHTML = "";
    messageEl.textContent = "";

    task.answers.forEach(answer => {

        const button =
            document.createElement("button");

        button.textContent = answer;

        button.onclick = () =>
            checkAnswer(answer);

        answersEl.appendChild(button);

    });

}

function checkAnswer(answer){

    if(answer === currentTask.correct){

        score += 100 * combo;
        combo++;

        messageEl.innerHTML =
            "✅ Oikein";

    }else{

        lives--;
        combo = 1;

        messageEl.innerHTML =
            "❌ Väärin";
    }

    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "mab8best",
            bestScore
        );
    }

    updateHUD();

    if(lives <= 0){

        endGame();
        return;
    }

    setTimeout(nextTask,1000);

}

function functionValueTask(){

    let a=rnd(-5,5);
    if(a===0) a=2;

    let b=rnd(-9,9);

    let x0=rnd(-3,3);

    const value=a*x0+b;

    return {

        question:`

        <div class="big">
            f(x)=${a}x${b>=0?"+":""}${b}
        </div>

        <div>Laske</div>

        <div class="big">
            f(${x0})
        </div>

        `,

        correct:String(value),

        answers:shuffle([
            String(value),
            String(value+1),
            String(value-1),
            String(value+2)
        ])

    };

}

function zeroTask(){

    const r=rnd(-8,8);

    return {

        question:`

        <div>Ratkaise</div>

        <div class="big">
        x ${r>=0?"-":"+"} ${Math.abs(r)} = 0
        </div>

        `,

        correct:String(r),

        answers:shuffle([
            String(r),
            String(-r),
            String(r+1),
            String(r-1)
        ])
    };

}

function derivativeTask(){

    const a=rnd(1,5);
    const b=rnd(-5,5);
    const c=rnd(-5,5);

    const correct=
        `${2*a}x${b>=0?"+":""}${b}`;

    return{

        question:`

        <div class="big">
        f(x)=${a}x²${b>=0?"+":""}${b}x${c>=0?"+":""}${c}
        </div>

        <div>
        Valitse derivaattafunktio
        </div>

        `,

        correct,

        answers:shuffle([
            correct,
            `${a}x${b>=0?"+":""}${b}`,
            `${2*a}x${b>=0?"-":"+"}${Math.abs(b)}`,
            `${a}x²`
        ])
    };

}

function graphTask(){

    const mode=rnd(1,3);

    let graph="";
    let correct="";

    if(mode===1){

        correct="f'(2) > 0";

        graph=`
        <svg width="280" height="170">

            <line
                x1="20" y1="130"
                x2="260" y2="130"
                stroke="gray"/>

            <line
                x1="140" y1="125"
                x2="140" y2="135"
                stroke="white"/>

            <text
                x="136"
                y="155"
                fill="white">2</text>

            <line
                x1="40" y1="110"
                x2="240" y2="30"
                stroke="white"
                stroke-width="4"/>


        </svg>
        `;
    }

    if(mode===2){

        correct="f'(2) < 0";

        graph=`
        <svg width="280" height="170">

            <line
                x1="20" y1="130"
                x2="260" y2="130"
                stroke="gray"/>

            <line
                x1="140" y1="125"
                x2="140" y2="135"
                stroke="white"/>

            <text
                x="136"
                y="155"
                fill="white">2</text>

            <line
                x1="40" y1="30"
                x2="240" y2="110"
                stroke="white"
                stroke-width="4"/>


        </svg>
        `;
    }

    if(mode===3){

        correct="f'(2) = 0";

        graph=`
        <svg width="280" height="170">

            <line
                x1="20" y1="130"
                x2="260" y2="130"
                stroke="gray"/>

            <line
                x1="140" y1="125"
                x2="140" y2="135"
                stroke="white"/>

            <text
                x="136"
                y="155"
                fill="white">2</text>

            <path
             d="M40 110 Q140 20 240 110"
             stroke="white"
             fill="none"
             stroke-width="4"/>

        </svg>
        `;
    }

    return{

        question:`
        ${graph}
        <div>Valitse oikea väite</div>
        `,

        correct,

        answers:[
            "f'(2) > 0",
            "f'(2) = 0",
            "f'(2) < 0"
        ]
    };
}

function extremaTask(){

    const maximum = Math.random()<0.5;

    return{

        question:`

        <div class="big">
        Merkkikaavio
        </div>

        <div
        style="
        font-size:2rem;
        width:320px;
        margin:auto;
        text-align:left;
        line-height:1.8;
        ">

            <div
            style="
            text-align:center;
            margin-bottom:10px;
            ">
            3
            </div>

            <div>
                f'(x):
                &nbsp;&nbsp;
                ${maximum?'+':'-'}
                &nbsp;&nbsp;0&nbsp;&nbsp;
                ${maximum?'-':'+'}
            </div>

            <div>
                f(x):
                &nbsp;&nbsp;
                ${maximum?'↗':'↘'}
                &nbsp;&nbsp;&nbsp;&nbsp;
                ${maximum?'↘':'↗'}
            </div>

        </div>

        <div>
        Ääriarvon laatu?
        </div>

        `,

        correct:
            maximum
            ? "Maksimi"
            : "Minimi",

        answers:[
            "Maksimi",
            "Minimi"
        ]
    };

}

const generators=[

    functionValueTask,
    functionValueTask,

    zeroTask,

    derivativeTask,
    derivativeTask,

    graphTask,
    graphTask,

    extremaTask

];

function nextTask(){

    const task =
        generators[
            rnd(0,generators.length-1)
        ]();

    showTask(task);

}

function endGame(){

    clearInterval(timer);
    
    messageEl.innerHTML = "";


    questionEl.innerHTML=`
        <h2>MAB8-peli päättyi</h2>

        <h3>${score} pistettä</h3>

        <p>Paras tulos: ${bestScore}</p>

<br>

<button
    onclick="location.reload()"
    style="
        padding:12px 25px;
        border:none;
        border-radius:10px;
        font-size:1rem;
        cursor:pointer;
    ">
    Uusi peli
</button>


        <hr style="margin:25px 0;">

        <p style="font-size:0.9rem;color:#aaa;">

        <br><br>

        MAB8-peli

        <br><br>

        Konsepti, pedagoginen suunnittelu ja toteutus: <br>
        Eero Nurmi © 2026

        <br><br>

        Toteutettu tekoälyavusteisesti käyttäen Microsoft Copilotia.
        </p>
    `;

    answersEl.innerHTML="";
}

const timer=setInterval(()=>{

    timeLeft--;

    timeEl.textContent=timeLeft;

    if(timeLeft<=0){
        endGame();
    }

},1000);

updateHUD();
nextTask();

</script>

</body>
</html>
